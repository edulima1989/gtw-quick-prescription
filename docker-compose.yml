name: quick-prescription

services:
  postgres:
    image: postgres:16-alpine
    container_name: prescription-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - prescription-net

  # ---------------- Microservices ----------------
  msa-authentication:
    build:
      context: ../msa-quick-prescription-authentication
    container_name: msa-authentication
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/usuarios_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      JWT_SECRET: ${JWT_SECRET:-replace-this-64-byte-minimum-jwt-secret-before-production-use-2026-auth}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prescription-net

  msa-quick-prescription:
    build:
      context: ../msa-quick-prescription
    container_name: msa-quick-prescription
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/prescriptions_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prescription-net

  # ---------------- Gateway ----------------
  gateway:
    build:
      context: .
    container_name: gtw-quick-prescription
    environment:
      PRESCRIPTIONS_SERVICE_URI: http://msa-quick-prescription:8081
      AUTH_SERVICE_URI: http://msa-authentication:8082
      SHELL_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - msa-authentication
      - msa-quick-prescription
    networks:
      - prescription-net

  # ---------------- Microfrontends ----------------
#  mf-shell:
#    build:
#      context: ../master_microfrontend_shell
#    container_name: mf-shell
#    ports:
#      - "3000:80"
#    depends_on:
#      - mf-reservas
#      - mf-admin
#      - mf-reportes
#      - gateway
#    networks:
#      - prescription-net

volumes:
  postgres-data:

networks:
  prescription-net:
    driver: bridge
